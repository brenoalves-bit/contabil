# Banco para desenvolvimento local. A API roda com `uv run uvicorn app.main:app --reload`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fiber
      POSTGRES_PASSWORD: fiber_dev_pw
      POSTGRES_DB: fiber_contabil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
